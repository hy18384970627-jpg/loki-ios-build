          +import Foundation
          +
          +enum SecureToken {
          +    static func read() -> String { "test" }
          +}
          +
          +struct MobileAPI {
          +    let base: String
          +    let token: String
          +    @MainActor static var samples: [(active: Bool, typing: Bool, session: String)] = []
          +
          +    @MainActor func data(_ path: String, _ body: [String: Any], timeout: Double) async throws -> Data {
          +        precondition(path == "/v1/care/interaction")
          +        precondition(Set(body.keys) == ["foreground", "typing", "observed_at", "session_id"])
          +        guard let active = body["foreground"] as? Bool, let typing = body["typing"] as? Bool,
          +              let session = body["session_id"] as? String, UUID(uuidString: session) != nil,
          +              let observed = body["observed_at"] as? Double, observed > 0 else { fatalError("Invalid interaction") }
          +        Self.samples.append((active, typing, session))
          +        return Data()
          +    }
          +}
          +
          +@main struct CompanionInteractionRegression {
          +    @MainActor static func requireCount(_ expected: Int) async throws {
          +        for _ in 0..<100 {
          +            if MobileAPI.samples.count >= expected { break }
          +            try await Task.sleep(for: .milliseconds(10))
          +        }
          +        precondition(MobileAPI.samples.count == expected)
          +    }
          +
          +    @MainActor static func main() async throws {
          +        UserDefaults.standard.set("test", forKey: "gatewayURL")
          +        defer { UserDefaults.standard.removeObject(forKey: "gatewayURL") }
          +        let interaction = CompanionInteraction()
          +        interaction.heartbeat()
          +        try await requireCount(1)
          +        precondition(!interaction.composing && MobileAPI.samples[0].active)
          +        for _ in 0..<150 { interaction.edited() }
          +        try await requireCount(2)
          +        precondition(interaction.composing && MobileAPI.samples[1].typing)
          +        try await Task.sleep(for: .milliseconds(7200))
          +        try await requireCount(3)
          +        precondition(!interaction.composing && !MobileAPI.samples[2].typing)
          +        interaction.setRecording(true)
          +        interaction.edited()
          +        interaction.endEditing()
          +        try await requireCount(4)
          +        precondition(interaction.composing)
          +        interaction.leaveApp()
          +        interaction.edited()
          +        try await requireCount(5)
          +        precondition(!interaction.composing && !MobileAPI.samples[4].active && !MobileAPI.samples[4].typing)
          +        interaction.heartbeat()
          +        try await requireCount(6)
          +        precondition(!interaction.composing && Set(MobileAPI.samples.map { $0.session }).count == 1)
