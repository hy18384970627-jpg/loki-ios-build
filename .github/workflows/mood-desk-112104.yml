          +import Foundation
          +
          +@MainActor final class CompanionInteraction {
          +    static let shared = CompanionInteraction()
          +
          +    private let session = UUID()
          +    private var foreground = false
          +    private var recording = false
          +    private var editingUntil: ContinuousClock.Instant?
          +    private var idleTask: Task<Void, Never>?
          +
          +    var composing: Bool {
          +        foreground && (recording || editingUntil != nil)
          +    }
          +
          +    func heartbeat() {
          +        foreground = true
          +        report()
          +    }
          +
          +    func leaveApp() {
          +        guard foreground else { return }
          +        foreground = false
          +        recording = false
          +        resetEditing()
          +        report()
          +    }
          +
          +    func edited() {
          +        guard foreground else { return }
          +        let wasComposing = composing
          +        editingUntil = ContinuousClock.now.advanced(by: .seconds(7))
          +        if !wasComposing { report() }
          +        guard idleTask == nil else { return }
          +        idleTask = Task { [weak self] in
          +            guard let self else { return }
          +            while let deadline = editingUntil {
          +                do { try await ContinuousClock().sleep(until: deadline) } catch { return }
          +                if deadline == editingUntil {
          +                    endEditing()
          +                    return
          +                }
          +            }
          +        }
          +    }
          +
          +    func endEditing() {
          +        guard editingUntil != nil else { return }
          +        resetEditing()
          +        if foreground && !recording { report() }
          +    }
          +
          +    func setRecording(_ value: Bool) {
          +        let wasComposing = composing
          +        recording = value
          +        if wasComposing != composing { report() }
          +    }
          +
          +    private func resetEditing() {
          +        editingUntil = nil
          +        idleTask?.cancel()
          +        idleTask = nil
          +    }
          +
          +    private func report() {
          +        let api = MobileAPI(base: UserDefaults.standard.string(forKey: "gatewayURL") ?? "", token: SecureToken.read())
          +        guard !api.base.isEmpty, !api.token.isEmpty else { return }
          +        let payload: [String: Any] = ["foreground": foreground, "typing": composing,
          +            "observed_at": Date().timeIntervalSince1970, "session_id": session.uuidString]
          +        Task { _ = try? await api.data("/v1/care/interaction", payload, timeout: 4) }
          +    }
          +}
