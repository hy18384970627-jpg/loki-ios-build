      - name: Reconstruct the verified 112302 client
        shell: bash
        run: |
          echo 'c93cbe1360871b5dfa47c925cf3ad8e246cded48f15f9a64c4329e4ef394d0f5  consent-base-recipe/.github/workflows/health-launch-112302.yml' | shasum -a 256 -c -
          ruby <<'PREVIOUS'
          require 'yaml'
          require 'json'
          steps = YAML.load_file('consent-base-recipe/.github/workflows/health-launch-112302.yml').fetch('jobs').fetch('app').fetch('steps')
          JSON.parse('["Reconstruct the verified 112301 client", "Apply reviewed launch changes"]').each do |name|
            matches = steps.select { |s| s['name'] == name }
            abort('Missing baseline step') unless matches.size == 1
            step=matches.first
            dir=step.fetch('working-directory','.')
            abort('Unexpected baseline directory') unless ['.','app-source'].include?(dir)
            system('/bin/bash','-e','-o','pipefail','-c',step.fetch('run'),chdir:dir) or abort(name)
          end
