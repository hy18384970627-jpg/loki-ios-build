          @@ -0,0 +1,31 @@
          +import Foundation
          +
          +enum HealthReadAccessPolicy {
          +    // Some HealthKit objects exist on a device before third parties may use them.
          +    // Compare against the published introduction, never just a non-nil object.
          +    static func shipped(_ identifier: String, version: OperatingSystemVersion) -> Bool {
          +        let minimum: (Int, Int)
          +        switch identifier {
          +        case "HKQuantityTypeIdentifierHipCircumference", "HKCharacteristicTypeIdentifierReferenceSex":
          +            // These are announced for 27.3 beta. Revisit when Apple ships public read access.
          +            return false
          +        case "HKQuantityTypeIdentifierHeartRateVariabilityRMSSD",
          +             "HKCategoryTypeIdentifierMenopausalState", "HKCategoryTypeIdentifierBleedingAfterMenopause":
          +            minimum = (27, 0)
          +        case "HKCategoryTypeIdentifierHypertensionEvent": minimum = (26, 2)
          +        default: return true
          +        }
          +        return version.majorVersion > minimum.0 ||
          +            (version.majorVersion == minimum.0 && version.minorVersion >= minimum.1)
          +    }
          +
          +    static func isOrdinary(_ identifier: String, version: OperatingSystemVersion) -> Bool {
          +        let families = ["HKQuantityTypeIdentifier", "HKCategoryTypeIdentifier", "HKCharacteristicTypeIdentifier"]
          +        return families.contains(where: { identifier.hasPrefix($0) }) && shipped(identifier, version: version)
          +    }
          +
          +    static func remaining(_ requested: Set<String>, afterRejecting rejected: [String]) -> Set<String>? {
          +        let next = requested.subtracting(rejected)
          +        return !next.isEmpty && next.count < requested.count ? next : nil
          +    }
          +}
