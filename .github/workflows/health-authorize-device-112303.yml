          +#import <Foundation/Foundation.h>
          +#import <HealthKit/HealthKit.h>
          +
          +NS_ASSUME_NONNULL_BEGIN
          +// These three calls are scoped to read access. Some OS versions raise a synchronous
          +// Objective-C validation exception instead of invoking the public NSError callback.
          +FOUNDATION_EXPORT void LokiHealthReadStatus(HKHealthStore *store, NSSet<HKObjectType *> *types,
          +    void (^completion)(HKAuthorizationRequestStatus status, NSError * _Nullable error));
          +FOUNDATION_EXPORT void LokiHealthRequestRead(HKHealthStore *store, NSSet<HKObjectType *> *types,
          +    void (^completion)(BOOL ok, NSError * _Nullable error));
          +FOUNDATION_EXPORT void LokiHealthRequestSelection(HKHealthStore *store, HKObjectType *type,
          +    void (^completion)(BOOL ok, NSError * _Nullable error));
          +NS_ASSUME_NONNULL_END
          --- /dev/null
          +++ b/Sources/App/LokiHealthAuthorization.m
          @@ -0,0 +1,43 @@
          +#import "LokiHealthAuthorization.h"
          +
          +static NSError *LokiHealthValidationError(NSException *exception, NSSet<HKObjectType *> *types) {
          +    NSCharacterSet *identifierCharacters = [NSCharacterSet alphanumericCharacterSet];
          +    NSArray<NSString *> *words = [(exception.reason ?: @"") componentsSeparatedByCharactersInSet:
          +                                   [identifierCharacters invertedSet]];
          +    NSSet<NSString *> *identifiers = [NSSet setWithArray:words];
          +    NSMutableArray<NSString *> *rejected = [NSMutableArray array];
          +    for (HKObjectType *type in types) {
          +        if ([identifiers containsObject:type.identifier]) { [rejected addObject:type.identifier]; }
          +    }
          +    return [NSError errorWithDomain:@"Loki.HealthAuthorization.Validation" code:1 userInfo:@{
          +        NSLocalizedDescriptionKey: @"当前系统不允许本应用请求部分健康项目。",
          +        @"rejected": rejected
          +    }];
          +}
          +
          +void LokiHealthReadStatus(HKHealthStore *store, NSSet<HKObjectType *> *types,
          +                          void (^completion)(HKAuthorizationRequestStatus, NSError * _Nullable)) {
          +    @try {
          +        [store getRequestStatusForAuthorizationToShareTypes:[NSSet set] readTypes:types completion:completion];
          +    } @catch (NSException *exception) {
          +        completion(HKAuthorizationRequestStatusUnknown, LokiHealthValidationError(exception, types));
          +    }
          +}
          +
          +void LokiHealthRequestRead(HKHealthStore *store, NSSet<HKObjectType *> *types,
          +                           void (^completion)(BOOL, NSError * _Nullable)) {
          +    @try {
          +        [store requestAuthorizationToShareTypes:[NSSet set] readTypes:types completion:completion];
          +    } @catch (NSException *exception) {
          +        completion(NO, LokiHealthValidationError(exception, types));
          +    }
          +}
          +
          +void LokiHealthRequestSelection(HKHealthStore *store, HKObjectType *type,
          +                                void (^completion)(BOOL, NSError * _Nullable)) {
          +    @try {
          +        [store requestPerObjectReadAuthorizationForType:type predicate:nil completion:completion];
          +    } @catch (NSException *exception) {
          +        completion(NO, LokiHealthValidationError(exception, [NSSet setWithObject:type]));
          +    }
          +}
