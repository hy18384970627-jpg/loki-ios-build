          @@ -0,0 +1,52 @@
          +import Foundation
          +import HealthKit
          +
          +@MainActor enum HealthReadAuthorization {
          +    static func status(_ types: Set<HKObjectType>, store: HKHealthStore) async throws -> HKAuthorizationRequestStatus {
          +        try await withCheckedThrowingContinuation { continuation in
          +            LokiHealthReadStatus(store, types) { status, error in
          +                if let error { continuation.resume(throwing: error) }
          +                else { continuation.resume(returning: status) }
          +            }
          +        }
          +    }
          +    private static func perform(_ operation: (@escaping (Bool, Error?) -> Void) -> Void) async throws {
          +        try await withCheckedThrowingContinuation { (continuation: CheckedContinuation<Void, Error>) in
          +            operation { ok, error in
          +                if let error { continuation.resume(throwing: error) }
          +                else if ok { continuation.resume() }
          +                else { continuation.resume(throwing: LokiError.message("Apple 健康未完成这次授权。")) }
          +            }
          +        }
          +    }
          +    // Called only by a button or by the person enabling sharing. "Unnecessary" means
          +    // the sheet was previously answered, never proof of read permission.
          +    static func request(_ types: Set<HKObjectType>, store: HKHealthStore) async throws -> Set<String> {
          +        guard !types.isEmpty else { throw LokiError.message("当前系统没有可申请的该类数据。") }
          +        var eligible = types
          +        while true {
          +            do {
          +                if try await status(eligible, store: store) != .unnecessary {
          +                    try await perform { completion in
          +                        LokiHealthRequestRead(store, eligible) { ok, error in completion(ok, error) }
          +                    }
          +                }
          +                return Set(eligible.map(\.identifier))
          +            } catch {
          +                let issue = error as NSError
          +                guard issue.domain == "Loki.HealthAuthorization.Validation",
          +                      let rejected = issue.userInfo["rejected"] as? [String],
          +                      let next = HealthReadAccessPolicy.remaining(Set(eligible.map(\.identifier)), afterRejecting: rejected) else {
          +                    throw error
          +                }
          +                eligible = eligible.filter { next.contains($0.identifier) }
          +            }
          +        }
          +    }
          +    static func select(_ type: HKObjectType, store: HKHealthStore) async throws {
          +        guard type.requiresPerObjectAuthorization() else { throw LokiError.message("当前系统不支持逐项选择此类记录。") }
          +        try await perform { completion in
          +            LokiHealthRequestSelection(store, type) { ok, error in completion(ok, error) }
          +        }
          +    }
          +}
