name: Build Loki background inbox 112102
on:
  push:
    branches: [main]
    paths: ['.github/workflows/background-inbox-112102.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loki-background-inbox-112102
  cancel-in-progress: false
jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hy18384970627-jpg/loki-iphone-control
          ref: 8be1a93226edf64a2be9678f429383bc891f3dce
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hy18384970627-jpg/loki-ios-build
          ref: d6b09385be43ff8b595f01c0729dad073f83fd82
          path: verified-recipe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hy18384970627-jpg/loki-ios-build
          ref: bdf05059603c369e0f2cceb56890ed1fa2f7d437
          path: prior-recipe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hy18384970627-jpg/loki-ios-build
          ref: 3d5400d4edd282c8353fe9ca5f811e64fa35d2a5
          path: notify-base-recipe
          persist-credentials: false
      - name: Reconstruct verified public build 112101
        shell: bash
        run: |
          echo 'b8b69d74335b40c4e184a420561087630597bb3520a25fb239d7e98bb151be57  notify-base-recipe/.github/workflows/notification-recovery-112101.yml' | shasum -a 256 -c -
          ruby <<'RUBY'
          require 'yaml'
          steps = YAML.load_file('notify-base-recipe/.github/workflows/notification-recovery-112101.yml').fetch('jobs').fetch('app').fetch('steps')
          ['Reconstruct verified public build 111805','Apply reviewed notification recovery changes'].each_with_index do |name, i|
            matching = steps.select { |s| s['name'] == name }
            abort('Missing prior step') unless matching.size == 1
            step = matching.first
            directory = i == 0 ? '.' : 'app-source'
            abort('Unexpected path') unless step.fetch('working-directory','.') == directory
            system('/bin/bash','-e','-o','pipefail','-c',step.fetch('run'), chdir: directory) or abort(name)
          end
          RUBY
      - name: Apply reviewed background inbox changes
