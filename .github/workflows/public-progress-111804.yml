name: Build Loki public progress 111804
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-progress-111804.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loki-public-progress-111804
  cancel-in-progress: false
jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hy18384970627-jpg/loki-iphone-control
          ref: 8be1a93226edf64a2be9678f429383bc891f3dce
          persist-credentials: false
      - name: Reconstruct verified public build 111803
        shell: bash
        run: |
          echo '0942e7dddd9931f289ca4c33b2dbe4a23fbd6618c139148c5adf1dc950572a26  .github/workflows/mood-activity.yml' | shasum -a 256 -c -
          ruby <<'RUBY'
          require 'yaml'
          definitions = YAML.load_file('.github/workflows/mood-activity.yml').fetch('jobs').fetch('app').fetch('steps')
          names = ['Verify and unpack reviewed source', 'Apply reviewed Live Activity extension', 'Apply expandable chat summary', 'Apply mood meters and live activity log']
          names.each_with_index do |name, position|
            entries = definitions.select { |entry| entry['name'] == name }
            raise 'unexpected source preparation step' unless entries.size == 1
            entry = entries.first
            directory = position == 0 ? '.' : 'app-source'
            raise 'unexpected source location' unless entry.fetch('working-directory','.') == directory
            system('/bin/bash', '-e', '-o', 'pipefail', '-c', entry.fetch('run'), chdir: directory) or abort("Source preparation failed: #{name}")
          end
          RUBY
      - name: Apply five reviewed Swift changes
        working-directory: app-source
        run: |
          echo '' | base64 -D > /tmp/phone-111804-diffs.zip
          echo 'e82dce2b7df2661e6573f0a2e7bc142ca37aab919201a731e3cb68fe75af5644  /tmp/phone-111804-diffs.zip' | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/phone-111804"
          unzip -q /tmp/phone-111804-diffs.zip -d "$RUNNER_TEMP/phone-111804"
          for diff in "$RUNNER_TEMP"/phone-111804/*.diff; do patch -p1 < "$diff"; done
          shasum -a 256 -c <<'CHECK_FILES'
          671927542549b805e60e218f1fe03b5e017625a33c3e0e6015fd9ea48d814d8f  Sources/App/API.swift
          d63749a32c08fb8b7e51c8bfa22a6229aed5f59932be9171c94ec80a8476abf0  Sources/App/AppState.swift
          256b9eca16d11488daa41c2672da5750b04559492d6aa063e124e053a011077e  Sources/App/ChatView.swift
          3c76b37563c51ea0726824a9af53d1a16df0286fd17515a7a4f552bc5c51f3d0  Sources/App/Models.swift
          43467fe98ac087ede5223a3766890be2c4a0e95303f9bbb2f4a245065aae1790  Sources/App/ThinkingPanel.swift
          CHECK_FILES
          python3 - <<'PYTHON'
          from pathlib import Path
          project = Path('project.yml')
          source = project.read_text()
          assert '111803' in source and '111804' not in source
          project.write_text(source.replace('111803', '111804'))
          PYTHON
      - name: Verify calibrated pointer math
        run: |
          cat app-source/Sources/App/PhonePointerMath.swift app-source/review/tests/pointer-math-check.swift > /tmp/pointer-check.swift
          swift /tmp/pointer-check.swift
      - name: Generate project
        working-directory: app-source
        run: |
          command -v xcodegen || brew install xcodegen
          swift scripts/generate-app-icon.swift
          xcodegen generate --spec project.yml
          mkdir -p build
      - name: Compile complete App for simulator
        working-directory: app-source
        run: |
          xcodebuild -project Loki.xcodeproj -scheme Loki -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO build > build/simulator.log 2>&1 || { tail -100 build/simulator.log; exit 1; }
      - name: Compile real iPhone architecture
        working-directory: app-source
        run: |
          xcodebuild -project Loki.xcodeproj -scheme Loki -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO build > build/device.log 2>&1 || { tail -100 build/device.log; exit 1; }
          python3 scripts/verify-device-build.py build/Device/Build/Products/Debug-iphoneos/Loki.app
          ditto -c -k --sequesterRsrc --keepParent build/Device/Build/Products/Debug-iphoneos/Loki.app build/Loki-screen-control-unsigned.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loki-public-progress-111804
          path: |
            app-source/build/simulator.log
            app-source/build/device.log
            app-source/build/Loki-screen-control-unsigned.zip
          retention-days: 1
