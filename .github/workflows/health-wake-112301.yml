          +/// Indices identify immutable HealthKit sample contents across interrupted uploads.
          +enum HealthArchiveParts {
          +    static func id(parent: UUID, series: String, index: Int) -> String {
          +        let seed = "\(parent.uuidString.lowercased())/\(series)/\(index)"
          +        var bytes = Array(SHA256.hash(data: Data(seed.utf8)).prefix(16))
          +        bytes[6] = (bytes[6] & 0x0f) | 0x80
          +        bytes[8] = (bytes[8] & 0x3f) | 0x80
          +        let hex = bytes.map { String(format: "%02x", $0) }.joined()
          +        let lengths = [8, 4, 4, 4, 12]
          +        var cursor = hex.startIndex
          +        return lengths.map { length in
          +            let end = hex.index(cursor, offsetBy: length)
          +            defer { cursor = end }
          +            return String(hex[cursor..<end])
          +        }.joined(separator: "-")
          +    }
