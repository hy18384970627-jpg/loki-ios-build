          +import Foundation
          +
          +/// Only anchors, work order and fingerprints live on disk; retries reread HealthKit.
          +struct HealthArchiveSchedule: Codable {
          +    var epoch: String
          +    var boundary: Date
          +    var queued: [String] = []
          +    var anchors: [String: Data] = [:]
          +    var fingerprints: [String: String] = [:]
          +    var lastReconciliation: Date?
          +    var activityDay: Date?
          +    var knownStock: [String: [String]] = [:]
          +
          +    init(epoch: String, now: Date = .now) {
          +        self.epoch = epoch
          +        boundary = Calendar.current.date(byAdding: .day, value: -30, to: now) ?? now
          +    }
          +    static func lanes(_ type: String) -> [String] { ["recent:" + type, "past:" + type] }
          +    mutating func register(_ types: [String], recheck: Bool) {
          +        for prefix in ["recent:", "past:"] {
          +            for type in types {
          +                let key = prefix + type
          +                if recheck || anchors[key] == nil { enqueue(key) }
          +            }
          +        }
          +    }
          +    mutating func enqueue(_ key: String) {
          +        if !queued.contains(key) { queued.append(key) }
          +    }
          +    // Leave the page in durable work until the corresponding server transaction commits.
          +    mutating func acknowledge(_ key: String, anchor: Data, hasMore: Bool) {
          +        anchors[key] = anchor
          +        queued.removeAll { $0 == key }
          +        if hasMore { enqueue(key) }
          +    }
          +}
