          ref: 8be1a93226edf64a2be9678f429383bc891f3dce
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hy18384970627-jpg/loki-ios-build
          ref: d6b09385be43ff8b595f01c0729dad073f83fd82
          path: verified-recipe
          persist-credentials: false
      - name: Reconstruct verified public build 111804
        shell: bash
        run: |
          echo '320c23d2ca69e5ce66e464324212df0ac535d0e0672a0440f467f7efef26269f  verified-recipe/.github/workflows/public-progress-111804.yml' | shasum -a 256 -c -
          ruby <<'RUBY'
          require 'yaml'
          all = YAML.load_file('verified-recipe/.github/workflows/public-progress-111804.yml').fetch('jobs').fetch('app').fetch('steps')
          ['Reconstruct verified public build 111803','Apply five reviewed Swift changes'].each_with_index do |name, i|
            found = all.select { |step| step['name'] == name }
            abort("Invalid step: #{name}") unless found.length == 1
            step = found.first
            directory = i == 0 ? '.' : 'app-source'
            abort('Invalid source location') unless step.fetch('working-directory','.') == directory
            system('/bin/bash','-e','-o','pipefail','-c',step.fetch('run'), chdir: directory) or abort("Failed: #{name}")
          end
          RUBY
