                           Section("生活与约定") {
                               NavigationLink { MusicView() } label: { Label("一起听", systemImage: "music.note") }
                               NavigationLink { ShoppingView() } label: { Label("淘宝", systemImage: "bag") }
          @@ -28,7 +37,9 @@
                               NavigationLink { SearchView() } label: { Label("搜索与计算", systemImage: "magnifyingglass") }
                               NavigationLink { CapabilitiesView() } label: { Label("功能与 iOS 边界", systemImage: "list.bullet.rectangle") }
                           }
          -            }.navigationTitle("生活")
          +            }
          +            .navigationTitle("生活")
          +            .task { await app.refreshMood() }
                   }
               }
           }
          LAUNCH_PATCH
          shasum -a 256 -c - <<'VERIFIED'
          60b2abee308cf6051a234b077995bc49ec33ee136f4fe752529b528edcc907e1  Sources/App/ChatView.swift
          8878947e52dd56c0965a4f441dc4921a3668d61491f66e5016d015acea78abc5  Sources/App/ToolsView.swift
          VERIFIED
          python3 - <<'VERSION'
          import subprocess
          subprocess.run(['ruby','-ryaml','-e', r'''
          p='project.yml'
          spec=YAML.load_file(p)
          settings=spec.fetch('settings').fetch('base')
          abort 'Unexpected prior build' unless settings.fetch('CURRENT_PROJECT_VERSION').to_s=='112305'
          settings['CURRENT_PROJECT_VERSION']='112306'
          targets=spec.fetch('targets')
          names=%w[Loki LokiLiveActivity FocusMonitor ShieldStyle ShieldActions UsageReport]
          names.each do |name|
            target=targets.fetch(name)
            abort 'Unexpected bundle type' unless %w[application app-extension].include?(target.fetch('type'))
            target.fetch('info').fetch('properties')['CFBundleVersion']='112306'
          end
          File.write(p,YAML.dump(spec))
          '''],check=True)
          VERSION
      - name: Check chat and life appearance
        working-directory: app-source
        shell: bash
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          chat=Path('Sources/App/ChatView.swift').read_text()
          life=Path('Sources/App/ToolsView.swift').read_text()
          heading=chat.split('ToolbarItem(placement: .principal)',1)[1].split('ToolbarItem(placement: .topBarTrailing)',1)[0]
          assert 'Image("LokiSignature")' in heading and '.frame(width: 68, height: 34)' in heading
          assert '.sharedBackgroundVisibility(.hidden)' in heading and '.shadow(' not in heading and 'Capsule(' not in heading
          assert 'MoodStrip(' not in chat and 'MoodStrip(state: mood)' in life and 'await app.refreshMood()' in life
          assert all(word not in chat for word in ('已排队重播','正在准备原声…','正在播放原声'))
          assert 'requestVoiceReplay(' in chat
          print('Signature, mood placement and voice replay gesture confirmed')
          CHECK
      - name: Test original voice stream response errors
        working-directory: app-source
        shell: bash
        run: |
          swiftc Sources/App/SpeechStreamResponseError.swift Sources/App/PCMDownload.swift Sources/App/SpeechTransportRetry.swift Tests/SpeechStreamResponse/main.swift -o "$RUNNER_TEMP/speech-response" && "$RUNNER_TEMP/speech-response"
