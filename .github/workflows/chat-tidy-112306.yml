        run: |
          swiftc Sources/Shared/LokiIslandState.swift Sources/App/Models.swift Sources/App/IslandReplayTarget.swift Tests/IslandReplay/main.swift -o "$RUNNER_TEMP/replay" && "$RUNNER_TEMP/replay"
      - name: Test desk reading continuation
        working-directory: app-source
        shell: bash
        run: |
          swiftc Sources/App/DeskChapterContinuation.swift Tests/DeskIslandFlowTests/main.swift -o "$RUNNER_TEMP/desk-flow" && "$RUNNER_TEMP/desk-flow"
      - name: Test music moment identity
        working-directory: app-source
        shell: bash
        run: |
          swiftc Sources/App/MusicModels.swift Sources/App/MusicMoment.swift Tests/MusicMoments/main.swift -o "$RUNNER_TEMP/music-moments" && "$RUNNER_TEMP/music-moments"
      - name: Test remote desk envelope decoding
        working-directory: app-source
        shell: bash
        run: |
          swiftc Sources/Shared/LokiIslandState.swift Tests/DeskPushEnvelope/main.swift -o "$RUNNER_TEMP/desk-push-envelope" && "$RUNNER_TEMP/desk-push-envelope" Tests/DeskPushEnvelope/start.json
      - name: Test HealthKit authorization group and OS version policy
        working-directory: app-source
        shell: bash
        run: |
          swiftc -swift-version 5 Sources/App/HealthReadAccessPolicy.swift Tests/HealthReadAccess/main.swift -o "$RUNNER_TEMP/health-access"
          "$RUNNER_TEMP/health-access"
      - name: Test sleep selection and overnight readings
        working-directory: app-source
        shell: bash
        run: |
          swiftc -swift-version 5 Sources/App/SleepIntervals.swift Sources/App/SleepDetails.swift Tests/SleepWakeHealth/main.swift -o "$RUNNER_TEMP/test-sleep-wake"
          "$RUNNER_TEMP/test-sleep-wake"
      - name: Health archive payload identity and binary reconstruction
        working-directory: app-source
        shell: bash
        run: |
          swiftc -swift-version 5 Sources/App/HealthArchivePayload.swift Tests/HealthArchivePayload/main.swift -o "$RUNNER_TEMP/health-archive-payload"
          "$RUNNER_TEMP/health-archive-payload"
      - name: Health archive scheduling and fairness
        working-directory: app-source
        shell: bash
        run: |
          swiftc -swift-version 5 Sources/App/HealthArchiveSchedule.swift Tests/HealthArchiveSchedule/main.swift -o "$RUNNER_TEMP/health-archive-scheduling"
          "$RUNNER_TEMP/health-archive-scheduling"
      - name: Test app presence, typing and voice activity
        working-directory: app-source
        shell: bash
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/App/CompanionInteraction.swift Tests/CompanionInteractionRegression/main.swift -o "$RUNNER_TEMP/test-interaction"
          "$RUNNER_TEMP/test-interaction"
      - name: Test message timestamps and legacy conversation order
        shell: bash
        working-directory: app-source
        run: |
          swiftc Sources/App/Models.swift Sources/App/ChatHistoryTiming.swift Tests/MessageTimes/main.swift -o "$RUNNER_TEMP/loki-message-times"
          "$RUNNER_TEMP/loki-message-times"
      - name: Test notification routing and inbox
        shell: bash
        working-directory: app-source
        run: |
          swiftc Sources/App/ChatNotificationInbox.swift Tests/NotificationRouting/main.swift -o "$RUNNER_TEMP/loki-notification-routing"
          "$RUNNER_TEMP/loki-notification-routing"
      - name: Test public reasoning and tool display
        shell: bash
        working-directory: app-source
        run: |
          awk '/^struct ChatItem:/ { exit } { print }' Sources/App/Models.swift > "$RUNNER_TEMP/display-tests.swift"
          cat >> "$RUNNER_TEMP/display-tests.swift" <<'SWIFT'
          let prefix = "Activity · Compare the two options."
          let tool = "Used the music search tool."
          let stages = "Activity · Received your message.\nWriting the reply."
          precondition(TurnProgressContent(summary: prefix, activity: tool).summary == prefix)
          precondition(TurnProgressContent(summary: prefix, activity: tool).activity == tool)
          precondition(TurnProgressContent(summary: stages).isEmpty)
          precondition(TurnProgressContent(summary: "Activity · " + tool, activity: tool).summary == nil)
          precondition(TurnProgressContent(summary: "Activity · " + tool, activity: tool).activity == tool)
          precondition(TurnProgressContent(summary: "Compare the options.").summary == "Compare the options.")
          precondition(TurnProgressContent(activity: tool).summary == nil)
          precondition(TurnProgressContent(activity: tool).activity == tool)
          print("Public progress and tool display regressions passed")
          SWIFT
          swift "$RUNNER_TEMP/display-tests.swift"
      - name: Verify calibrated pointer math
        run: |
          cat app-source/Sources/App/PhonePointerMath.swift app-source/review/tests/pointer-math-check.swift > /tmp/pointer-check.swift
          swift /tmp/pointer-check.swift
      - name: Generate project
        working-directory: app-source
        run: |
          command -v xcodegen || brew install xcodegen
          swift scripts/generate-app-icon.swift
          xcodegen generate --spec project.yml
          mkdir -p build
      - name: Compile real iPhone architecture
        working-directory: app-source
        run: |
          xcodebuild -project Loki.xcodeproj -scheme Loki -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO build > build/device.log 2>&1 || { tail -100 build/device.log; exit 1; }
          python3 scripts/verify-device-build.py build/Device/Build/Products/Debug-iphoneos/Loki.app
          ditto -c -k --sequesterRsrc --keepParent build/Device/Build/Products/Debug-iphoneos/Loki.app build/Loki-screen-control-unsigned.zip
      - name: Verify device App Intent metadata
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'INTENTS'
          from pathlib import Path
          import json,plistlib
          app=Path('build/Device/Build/Products/Debug-iphoneos/Loki.app')
          widget=next(p for p in (app/'PlugIns').glob('*.appex') if 'liveactivity' in plistlib.loads((p/'Info.plist').read_bytes())['CFBundleIdentifier'])
          infos=[app/'Info.plist', *sorted(app.glob('PlugIns/*.appex/Info.plist'))]
          assert len(infos)==6, 'Expected the app and five extensions'
          assert all(plistlib.loads(p.read_bytes())['CFBundleVersion']=='112306' for p in infos), 'Bundle version mismatch'
          print('Verified six iPhoneOS bundle versions at 112306')
          expected={'LokiIslandAudioIntent','LokiMomentControlIntent'}
          found=set()
          for bundle in (app,widget):
              m=bundle/'Metadata.appintents'/'extract.actionsdata'
              if m.exists():
                  data=json.dumps(json.loads(m.read_bytes()))
                  found.update(s for s in expected if s in data)
                  print(bundle.name,'extracted App Intent metadata',m.stat().st_size)
              binary=bundle/plistlib.loads((bundle/'Info.plist').read_bytes())['CFBundleExecutable']
              body=b''.join(p.read_bytes() for p in (binary,*bundle.glob('*.debug.dylib')))
              assert all(x.encode() in body for x in expected),bundle.name
          assert found==expected,sorted(expected-found)
          INTENTS
      - name: Upload verified iPhone architecture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loki-chat-tidy-112306-device
          path: |
            app-source/build/device.log
            app-source/build/Loki-screen-control-unsigned.zip
          if-no-files-found: error
          retention-days: 1
      - name: Preserve compiler diagnostics if the device build fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loki-chat-tidy-112306-diagnostics
          path: app-source/build/device.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Install and launch iPhone simulator build
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/island-devices.json"
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/island-runtimes.json"
          device="$(python3 - "$RUNNER_TEMP/island-devices.json" "$RUNNER_TEMP/island-runtimes.json" <<'SELECT_DEVICE'
          import json,re,sys
          from pathlib import Path
          by_runtime=json.loads(Path(sys.argv[1]).read_text())['devices']
          runtimes={r['identifier']:r for r in json.loads(Path(sys.argv[2]).read_text())['runtimes']}
          options=[]
          for key,devices in by_runtime.items():
              if '.iOS-' not in key:continue
              match=re.match(r'([0-9]+)(?:[.-]([0-9]+))?',runtimes.get(key,{}).get('version','') or key.split('.iOS-')[-1])
              if not match:continue
              version=(int(match[1]),int(match[2] or 0))
              if version<(26,0):continue
              for d in devices:
                  if d['name'].startswith('iPhone') and d.get('isAvailable',True):
                      rank=(d['name']=='iPhone 18 Pro Max',version==(27,2),'Pro Max' in d['name'],version,'Pro' in d['name'])
                      options.append((rank,d['udid'],d['name'],version))
          assert options, 'No compatible iPhone simulator is installed'
          _,udid,name,version=max(options)
          print(f'Running on {name}, iOS {version[0]}.{version[1]}',file=sys.stderr)
          print(udid)
          SELECT_DEVICE
          )"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          mkdir -p build
          xcodebuild -project Loki.xcodeproj -scheme Loki -configuration Debug -sdk iphonesimulator -destination "id=$device" -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO build > build/simulator.log 2>&1 || { tail -100 build/simulator.log; exit 1; }
          app='build/Simulator/Build/Products/Debug-iphonesimulator/Loki.app'
          python3 - "$app" <<'VERIFY_SIM_BUILD'
          import plistlib,sys
          from pathlib import Path
          app=Path(sys.argv[1]); infos=[app/'Info.plist',*sorted(app.glob('PlugIns/*.appex/Info.plist'))]
          assert len(infos)==6 and all(plistlib.loads(p.read_bytes())['CFBundleVersion']=='112306' for p in infos)
          print('Verified six simulator bundle versions at 112306')
          VERIFY_SIM_BUILD
          xcrun simctl install "$device" "$app"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          result="$(xcrun simctl launch "$device" "$bundle")"
          pid="$(echo "$result" | awk '{print $NF}')"
          sleep 3
          ps -p "$pid" -o pid= >/dev/null
          xcrun simctl terminate "$device" "$bundle"
          second="$(xcrun simctl launch "$device" "$bundle")"
          second_pid="$(echo "$second" | awk '{print $NF}')"
          test "$pid" != "$second_pid"
          sleep 5
          ps -p "$second_pid" -o pid= >/dev/null
          echo "Verified first and second launches for $bundle"
      - name: Capture isolated simulator signature sample
        id: header_preview
        continue-on-error: true
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices booted -j | python3 -c "import json,sys;print(next(x['udid'] for ds in json.load(sys.stdin)['devices'].values() for x in ds if x['name']=='iPhone 18 Pro Max' and x['state']=='Booted'))")"
          bundle=dev.zcydrkv7yh.loki
          xcrun simctl terminate "$device" "$bundle"
          xcrun simctl launch "$device" "$bundle" --loki-design-chat -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN
          sleep 5
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/header-source.png"
          cat > "$RUNNER_TEMP/header-crop.swift" <<'CROP'
          import Foundation
          import CoreGraphics
          import ImageIO
          import UniformTypeIdentifiers
          let directory=URL(fileURLWithPath: CommandLine.arguments[1],isDirectory:true)
          guard let source=CGImageSourceCreateWithURL(directory.appendingPathComponent("header-source.png") as CFURL,nil),
                let image=CGImageSourceCreateImageAtIndex(source,0,nil) else { exit(2) }
          let w=Double(image.width),h=Double(image.height)
          let frame=CGRect(x:w*0.33, y:h*0.060, width:w*0.34, height:h*0.050).integral
          guard let title=image.cropping(to:frame), let destination=CGImageDestinationCreateWithURL(directory.appendingPathComponent("chat-header.png") as CFURL,UTType.png.identifier as CFString,1,nil) else { exit(3) }
          CGImageDestinationAddImage(destination,title,nil)
          guard CGImageDestinationFinalize(destination) else { exit(4) }
          print("Simulator header crop:", title.width, "by", title.height)
          CROP
          swift "$RUNNER_TEMP/header-crop.swift" "$RUNNER_TEMP"
      - name: Upload cropped simulator signature
        if: steps.header_preview.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loki-chat-tidy-112306-header
          path: ${{ runner.temp }}/chat-header.png
          if-no-files-found: error
          retention-days: 1
      - name: Print simulator diagnostics
        working-directory: app-source
        if: failure()
        shell: bash
        run: |
          if test -f build/simulator.log; then tail -100 build/simulator.log; fi
