name: Build Loki chat layout for iPhone 112306
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chat-tidy-112306.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loki-chat-tidy-112306
  cancel-in-progress: false
jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
