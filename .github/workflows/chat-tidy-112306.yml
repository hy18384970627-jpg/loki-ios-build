      - name: Reconstruct the verified 112305 client
        shell: bash
        run: |
          echo '6c1b3521ce390f751e28adb6331193427df54fbec7d667b3bd92378c34e79e50  appearance-base-recipe/.github/workflows/voice-replay-112305.yml' | shasum -a 256 -c -
          ruby <<'PREVIOUS'
          require 'yaml'
          require 'json'
          steps = YAML.load_file('appearance-base-recipe/.github/workflows/voice-replay-112305.yml').fetch('jobs').fetch('app').fetch('steps')
          JSON.parse('["Reconstruct the verified 112304 client", "Apply reviewed voice replay changes"]').each do |name|
            matches = steps.select { |s| s['name'] == name }
            abort('Missing baseline step') unless matches.size == 1
            step=matches.first
            dir=step.fetch('working-directory','.')
            abort('Unexpected baseline directory') unless ['.','app-source'].include?(dir)
            system('/bin/bash','-e','-o','pipefail','-c',step.fetch('run'),chdir:dir) or abort(name)
          end
          PREVIOUS
      - name: Apply reviewed chat appearance changes
        working-directory: app-source
        shell: bash
        run: |
          python3 - <<'BASE_CHECK'
          from pathlib import Path
          import hashlib, json
          known = json.loads('{"Sources/App/ChatView.swift": "e2d485dab551dd79ed9aa24d6e93acdca3c0e41d102f12e0ea4361c169f9448d", "Sources/App/ToolsView.swift": "7a0852dc5788c4a8bc2c1bc7a819672f325bdec1ab63059e2ef292a7c88bb950"}')
          for name, expected in known.items():
              p=Path(name)
              data=p.read_bytes()
              clean=data.decode('utf-8-sig').replace(chr(13)+chr(10),chr(10)).encode()
              assert hashlib.sha256(clean).hexdigest()==expected, name
              if clean!=data: p.write_bytes(clean)
          BASE_CHECK
          shasum -a 256 -c - <<'BASELINE'
          e2d485dab551dd79ed9aa24d6e93acdca3c0e41d102f12e0ea4361c169f9448d  Sources/App/ChatView.swift
          7a0852dc5788c4a8bc2c1bc7a819672f325bdec1ab63059e2ef292a7c88bb950  Sources/App/ToolsView.swift
          BASELINE
          patch --batch -p1 <<'LAUNCH_PATCH'
          --- a/Sources/App/ChatView.swift
          +++ b/Sources/App/ChatView.swift
          @@ -46,7 +46,6 @@
               var body: some View {
                   NavigationStack {
                       VStack(spacing: 0) {
          -                if let mood = app.mood, paired { MoodStrip(state: mood) }
                           ScrollViewReader { proxy in
                               ScrollView {
                                   LazyVStack(alignment: .leading, spacing: 9) {
          @@ -73,7 +72,6 @@
                                           ChatBubble(message: message, beginsGroup: newGroup,
                                                      isPlaying: message.recordedVoice == nil ? voice.audibleReplyID == message.id
                                                          : voice.playing && voice.playingMessageID == message.id,
          -                                           replayPhase: app.manualReplay.phase(for: message.id, audible: voice.audibleReplyID),
                                                      canRetry: !app.callActive,
                                                      preview: previewMessages != nil,
                                                      playbackFraction: { voice.recordedPlaybackFraction(for: message.id) },
          @@ -288,13 +286,10 @@
                                   .renderingMode(.template)
                                   .resizable().scaledToFit()
                                   .foregroundStyle(.primary)
          -                        .frame(width: 34, height: 17)
          -                        .background {
          -                            Capsule().fill(LokiDesign.ground.opacity(0.8))
          -                                .frame(width: 29, height: 17)
          -                        }
          +                        .frame(width: 68, height: 34)
                                   .accessibilityLabel("Loki")
                           }
          +                .sharedBackgroundVisibility(.hidden)
                           ToolbarItem(placement: .topBarTrailing) {
                               Button { composerFocused = false; call.start(app: app, voice: voice, health: health, alarms: alarms, focus: focus) } label: { Image(systemName: "phone") }
                                   .accessibilityLabel("与 Loki 语音通话")
          @@ -410,7 +405,6 @@
               let message: ChatItem
               let beginsGroup: Bool
               let isPlaying: Bool
          -    let replayPhase: ManualVoiceReplay.Phase?
               let canRetry: Bool
               let preview: Bool
               let playbackFraction: () -> Double?
          @@ -497,15 +491,6 @@
                                                        replay: replay))
                           .accessibilityLabel(outgoing ? "发出的消息" : "Loki 的消息")
                           .accessibilityValue(message.recordedVoice.map { "语音 \(Int(ceil($0.duration))) 秒" } ?? message.displayText)
          -                if let replayPhase {
          -                    Group {
          -                        switch replayPhase {
          -                        case .queued: Label("已排队重播", systemImage: "clock")
          -                        case .waiting: Label("正在准备原声…", systemImage: "hourglass")
          -                        case .playing: Label("正在播放原声", systemImage: "speaker.wave.2")
          -                        }
          -                    }.font(.caption2).foregroundStyle(LokiDesign.gold)
          -                }
                           if let note = message.localActionNote {
                               Text(note).font(.caption).padding(8)
                                   .lokiPanel(fill: LokiDesign.raised, radius: 10)
          --- a/Sources/App/ToolsView.swift
          +++ b/Sources/App/ToolsView.swift
          @@ -5,9 +5,18 @@
           import PhotosUI
           
           struct ToolsView: View {
          +    @EnvironmentObject private var app: AppState
          +
               var body: some View {
                   NavigationStack {
                       List {
          +                if let mood = app.mood, app.paired {
          +                    Section {
          +                        MoodStrip(state: mood)
          +                            .listRowInsets(EdgeInsets(top: 8, leading: 0, bottom: 8, trailing: 0))
