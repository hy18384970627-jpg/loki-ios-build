          +    static func check(status: Int?, mimeType: String?, sampleRate: String?) -> Self? {
          +        guard let status else { return .missingHTTPResponse }
          +        guard status == 200 else { return .httpStatus(status) }
          +        guard mimeType?.lowercased() == "audio/pcm" else { return .unexpectedFormat }
          +        guard sampleRate == "24000" else { return .unexpectedSampleRate }
          +        return nil
          +    }
          +
          +    static var errorDomain: String { "LokiSpeechStream" }
          +    var errorCode: Int {
          +        switch self {
          +        case .missingHTTPResponse: return -1
          +        case .httpStatus(let status): return status
          +        case .unexpectedFormat: return -2
          +        case .unexpectedSampleRate: return -3
          +        }
          +    }
          +    var errorUserInfo: [String: Any] {
          +        [NSLocalizedDescriptionKey: errorDescription ?? "语音播放失败。"]
          +    }
          +    var errorDescription: String? {
          +        switch self {
          +        case .missingHTTPResponse:
          +            return "没有收到语音服务的有效响应，请稍后双击重播。"
          +        case .unexpectedFormat:
          +            return "语音服务返回了无法播放的音频格式，请稍后双击重播。"
          +        case .unexpectedSampleRate:
          +            return "原声音频的采样率异常，请稍后双击重播。"
          +        case .httpStatus(let status):
          +            let reason: String
          +            switch status {
          +            case 401: reason = "语音请求未通过身份验证，请检查 Loki 的配对状态。"
          +            case 403: reason = "当前入口拒绝了语音请求。"
          +            case 404: reason = "当前入口找不到原声服务。"
          +            case 400, 413, 422: reason = "原声服务无法处理这条消息的播放请求。"
          +            case 409: reason = "原声服务正处理另一条语音，请稍后双击重播。"
          +            case 429: reason = "语音请求太频繁，请稍后双击重播。"
          +            case 502, 503, 504: reason = "原声服务暂时未能提供音频，请稍后双击重播。"
          +            default: reason = "语音请求未取得可播放的音频，请稍后双击重播。"
          +            }
          +            return "\(reason)（HTTP \(status)）"
          +        }
          +    }
          +}
