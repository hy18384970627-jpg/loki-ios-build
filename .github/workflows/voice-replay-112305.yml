          +precondition(check(200) == nil)
          +precondition(check(200, "Audio/PCM") == nil)
          +precondition(check(nil) == .missingHTTPResponse)
          +precondition(check(200, "text/html") == .unexpectedFormat)
          +precondition(check(200, nil) == .unexpectedFormat)
          +precondition(check(200, "audio/pcm", nil) == .unexpectedSampleRate)
          +precondition(check(200, "audio/pcm", "48000") == .unexpectedSampleRate)
          +for status in [204, 302, 400, 401, 403, 404, 409, 413, 422, 429, 500, 502, 503, 504] {
          +    let issue = check(status, "application/json", nil)
          +    precondition(issue == .httpStatus(status))
          +    let bridged = issue! as NSError
          +    precondition(bridged.domain == "LokiSpeechStream" && bridged.code == status)
          +    precondition(bridged.localizedDescription.contains("HTTP \(status)"))
          +    precondition(!SpeechTransportRetry.shouldRetry(bridged, attempt: 0, receivedBytes: 0))
