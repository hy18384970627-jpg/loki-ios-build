          +import Foundation
          +
          +/// One outstanding playback per tapped bubble. The active sound may finish while a
          +/// replay of that same bubble is already queued, so only finish the active phase.
          +struct ManualVoiceReplay {
          +    enum Phase: Equatable { case queued, waiting, playing }
          +    enum Action: String { case joinedStream, promoted, inserted, alreadyPending }
          +    struct Ticket {
          +        let attempt: UUID
          +        var phase: Phase
          +    }
          +    private var tickets: [UUID: Ticket] = [:]
          +
          +    subscript(_ message: UUID) -> Ticket? { tickets[message] }
          +    var hasPending: Bool { !tickets.isEmpty }
          +    func phase(for id: UUID, audible: UUID?) -> Phase? {
          +        guard let phase = tickets[id]?.phase else { return nil }
          +        return phase == .playing && audible != id ? .waiting : phase
          +    }
          +
          +    mutating func request(_ id: UUID, attempt: UUID, active: UUID?, audible: UUID?, queued: Bool) -> Action {
          +        if let ticket = tickets[id], ticket.phase != .playing { return .alreadyPending }
          +        if active == id && audible != id {
          +            tickets[id] = Ticket(attempt: attempt, phase: .waiting)
          +            return .joinedStream
          +        }
          +        tickets[id] = Ticket(attempt: attempt, phase: .queued)
          +        return queued ? .promoted : .inserted
          +    }
          +
          +    mutating func beganWaiting(_ id: UUID) -> UUID? {
          +        guard tickets[id]?.phase == .queued else { return nil }
          +        tickets[id]?.phase = .waiting
          +        return tickets[id]?.attempt
          +    }
          +
          +    mutating func beganOutput(_ id: UUID) -> UUID? {
          +        guard tickets[id]?.phase == .waiting else { return nil }
          +        tickets[id]?.phase = .playing
          +        return tickets[id]?.attempt
          +    }
          +
          +    mutating func finish(_ id: UUID) -> UUID? {
          +        guard let ticket = tickets[id], ticket.phase != .queued else { return nil }
          +        tickets.removeValue(forKey: id)
          +        return ticket.attempt
          +    }
          +
          +    mutating func cancelAll() { tickets.removeAll() }
          +}
          +
          +/// Skip a reply's unusable cached audio until a fresh stream replaces it.
          +struct VoiceCacheRecovery {
          +    private var failed: Set<UUID> = []
          +    func mayRead(_ id: UUID) -> Bool { !failed.contains(id) }
          +    mutating func failedToPlay(_ id: UUID) { failed.insert(id) }
          +    mutating func savedReplacement(_ id: UUID) { failed.remove(id) }
          +}
