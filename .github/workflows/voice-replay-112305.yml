          +// PCMDownload uses the app's generic error only for excessive buffering.
          +enum LokiError: Error { case message(String) }
          +
          +func check(_ status: Int?, _ mime: String? = "audio/pcm", _ rate: String? = "24000") -> SpeechStreamResponseError? {
          +    SpeechStreamResponseError.check(status: status, mimeType: mime, sampleRate: rate)
          +}
