          INTENTS
      - name: Upload verified iPhone architecture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loki-voice-replay-112305-device
          path: |
            app-source/build/device.log
            app-source/build/Loki-screen-control-unsigned.zip
          if-no-files-found: error
          retention-days: 1
      - name: Preserve compiler diagnostics if the device build fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: loki-voice-replay-112305-diagnostics
          path: app-source/build/device.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Install and launch iPhone simulator build
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/island-devices.json"
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/island-runtimes.json"
          device="$(python3 - "$RUNNER_TEMP/island-devices.json" "$RUNNER_TEMP/island-runtimes.json" <<'SELECT_DEVICE'
          import json,re,sys
          from pathlib import Path
          by_runtime=json.loads(Path(sys.argv[1]).read_text())['devices']
          runtimes={r['identifier']:r for r in json.loads(Path(sys.argv[2]).read_text())['runtimes']}
          options=[]
          for key,devices in by_runtime.items():
              if '.iOS-' not in key:continue
              match=re.match(r'([0-9]+)(?:[.-]([0-9]+))?',runtimes.get(key,{}).get('version','') or key.split('.iOS-')[-1])
              if not match:continue
              version=(int(match[1]),int(match[2] or 0))
              if version<(26,0):continue
              for d in devices:
                  if d['name'].startswith('iPhone') and d.get('isAvailable',True):
                      rank=(d['name']=='iPhone 18 Pro Max',version==(27,2),'Pro Max' in d['name'],version,'Pro' in d['name'])
                      options.append((rank,d['udid'],d['name'],version))
          assert options, 'No compatible iPhone simulator is installed'
          _,udid,name,version=max(options)
          print(f'Running on {name}, iOS {version[0]}.{version[1]}',file=sys.stderr)
          print(udid)
          SELECT_DEVICE
          )"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          mkdir -p build
          xcodebuild -project Loki.xcodeproj -scheme Loki -configuration Debug -sdk iphonesimulator -destination "id=$device" -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO build > build/simulator.log 2>&1 || { tail -100 build/simulator.log; exit 1; }
          app='build/Simulator/Build/Products/Debug-iphonesimulator/Loki.app'
          xcrun simctl install "$device" "$app"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          result="$(xcrun simctl launch "$device" "$bundle")"
          pid="$(echo "$result" | awk '{print $NF}')"
          sleep 3
          ps -p "$pid" -o pid= >/dev/null
          xcrun simctl terminate "$device" "$bundle"
          second="$(xcrun simctl launch "$device" "$bundle")"
          second_pid="$(echo "$second" | awk '{print $NF}')"
          test "$pid" != "$second_pid"
          sleep 5
          ps -p "$second_pid" -o pid= >/dev/null
          echo "Verified first and second launches for $bundle"
      - name: Print simulator diagnostics
        working-directory: app-source
        if: failure()
        shell: bash
        run: |
          if test -f build/simulator.log; then tail -100 build/simulator.log; fi
