          +import Foundation
          +
          +let first = UUID(), second = UUID(), third = UUID()
          +let originalTap = UUID(), repeatedTap = UUID(), audibleTap = UUID()
          +var replay = ManualVoiceReplay()
          +
          +// While the first packet is pending, a tap joins the active sentence. Repeated taps
          +// must neither toggle stop nor schedule another TTS request.
          +precondition(replay.request(first, attempt: originalTap, active: first, audible: nil, queued: false) == .joinedStream)
          +precondition(replay.request(first, attempt: repeatedTap, active: first, audible: nil, queued: false) == .alreadyPending)
          +precondition(replay.phase(for: first, audible: nil) == .waiting)
          +precondition(replay.beganOutput(second) == nil)
          +precondition(replay.beganOutput(first) == originalTap)
          +precondition(replay.beganOutput(first) == nil)
          +precondition(replay.phase(for: first, audible: first) == .playing)
          +precondition(replay.phase(for: first, audible: nil) == .waiting)
          +
          +// If audio is already coming out, queue one replay. Completion of the current
          +// sound must not consume the queued replay even though it has the same message ID.
          +precondition(replay.request(first, attempt: audibleTap, active: first, audible: first, queued: false) == .inserted)
          +precondition(replay.request(first, attempt: repeatedTap, active: first, audible: first, queued: true) == .alreadyPending)
          +precondition(replay.finish(first) == nil && replay[first]?.phase == .queued)
          +precondition(replay.beganWaiting(first) == audibleTap)
          +precondition(replay.beganOutput(first) == audibleTap)
          +precondition(replay.finish(first) == audibleTap && !replay.hasPending)
          +
          +// An automatic packet which already exists is promoted, preserving every other
          +// item once and in order. A failure while waiting allows an immediate new tap.
          +var queue = SentencePlaybackQueue<UUID>()
          +queue.insert([first, second, third], interject: false, preservePreparedNext: false)
          +precondition(replay.request(second, attempt: originalTap, active: nil, audible: nil,
          +    queued: queue.contains { $0 == second }) == .promoted)
          +queue.promoteFirst { $0 == second }
          +precondition(queue.take() == second && queue.take() == first && queue.take() == third && queue.isEmpty)
          +precondition(replay.beganWaiting(second) == originalTap)
          +precondition(replay.finish(second) == originalTap)
          +precondition(replay.request(second, attempt: repeatedTap, active: nil, audible: nil, queued: false) == .inserted)
          +replay.cancelAll()
          +precondition(!replay.hasPending && replay.beganOutput(second) == nil)
          +var cache = VoiceCacheRecovery()
          +cache.failedToPlay(first)
          +precondition(!cache.mayRead(first) && cache.mayRead(second))
          +cache.failedToPlay(second)
          +cache.savedReplacement(first)
          +precondition(cache.mayRead(first) && !cache.mayRead(second))
          +print("Manual voice replay and cache recovery passed")
