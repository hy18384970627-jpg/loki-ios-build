          +import ActivityKit
          +import UIKit
          +
          +@MainActor final class LokiIsland {
          +    static let shared = LokiIsland()
          +    private typealias Moment = Activity<LokiMomentAttributes>
          +    private var tails: [LokiIslandKind: (UUID, Task<Void, Never>)] = [:]
          +
          +    private func serial(_ kind: LokiIslandKind, operation: @escaping @MainActor () async -> Void) async {
          +        let previous = tails[kind]?.1, id = UUID()
          +        let task = Task { @MainActor in
          +            await previous?.value
          +            await operation()
          +        }
          +        tails[kind] = (id, task)
          +        await task.value
          +        if tails[kind]?.0 == id { tails[kind] = nil }
          +    }
          +
          +    func show(kind: LokiIslandKind, key: String, phase: String, title: String, detail: String,
          +              note: String = "", action: LokiIslandAction? = nil, token: String = "",
          +              until: Date? = nil, staleAt: Date) async {
          +        guard !key.isEmpty, key.utf8.count <= 256 else { return }
          +        await serial(kind) {
          +            guard ChatLiveActivity.shared.enabled, ActivityAuthorizationInfo().areActivitiesEnabled,
          +                  AppState.islandShared.paired, staleAt > Date() else { return }
          +            let validToken = token.utf8.count <= 768
          +            let state = LokiMomentAttributes.ContentState(key: key, phase: phase,
          +                title: IslandText.limit(title, bytes: 280), detail: IslandText.limit(detail, bytes: 600),
          +                note: IslandText.limit(note, bytes: 160), action: validToken ? action : nil,
          +                token: validToken ? token : "", until: until)
          +            let score = kind == .busy ? 10.0 : (phase == "reading" || phase == "playing" ? 65 : 40)
          +            let content = ActivityContent(state: state, staleDate: staleAt, relevanceScore: score)
          +            let matches = Moment.activities.filter { $0.attributes.kind == kind && [.active, .stale].contains($0.activityState) }
          +            if let current = matches.first(where: { $0.content.state.key == key && $0.content.state.phase == phase })
          +                ?? matches.first(where: { $0.content.state.key == key }) ?? matches.first {
          +                for duplicate in matches where duplicate.id != current.id { await duplicate.end(nil, dismissalPolicy: .immediate) }
          +                let age = current.content.staleDate?.timeIntervalSinceNow ?? 0
          +                if current.content.state != state || age < 12 || abs((current.content.staleDate ?? .distantPast).timeIntervalSince(staleAt)) > 45 {
          +                    await current.update(content)
          +                }
          +            } else if UIApplication.shared.applicationState == .active {
          +                _ = try? Moment.request(attributes: .init(kind: kind), content: content, pushType: nil)
          +            }
          +        }
          +    }
          +
          +    func hide(_ kind: LokiIslandKind, key: String? = nil) async {
          +        await serial(kind) {
          +            for item in Moment.activities where item.attributes.kind == kind && (key == nil || item.content.state.key == key) {
          +                await item.end(nil, dismissalPolicy: .immediate)
          +            }
          +        }
          +    }
          +
          +    func endAll() async {
          +        for kind in LokiIslandKind.allCases { await hide(kind) }
