          +    let lines: [MusicLyricLine]
          +    private static let stamp = try! NSRegularExpression(pattern: #"\[(\d{1,3}):([0-5]\d)(?:[.:](\d{1,3}))?\]"#)
          +    private static let offset = try! NSRegularExpression(pattern: #"(?im)^\s*\[offset:\s*([+-]?\d{1,7})\s*\]"#)
          +
          +    init(_ lrc: String = "") {
          +        let document = lrc as NSString
          +        let match = Self.offset.firstMatch(in: lrc, range: NSRange(location: 0, length: document.length))
          +        let adjustment = match.flatMap { Int(document.substring(with: $0.range(at: 1))) } ?? 0
          +        var byTime: [Int: String] = [:]
          +        for raw in lrc.components(separatedBy: .newlines) {
          +            let source = raw as NSString
          +            let stamps = Self.stamp.matches(in: raw, range: NSRange(location: 0, length: source.length))
          +            guard let last = stamps.last else { continue }
          +            let text = String(source.substring(from: NSMaxRange(last.range)).trimmingCharacters(in: .whitespaces).prefix(220))
          +            for stamp in stamps {
          +                guard let minutes = Int(source.substring(with: stamp.range(at: 1))),
          +                      let seconds = Int(source.substring(with: stamp.range(at: 2))) else { continue }
          +                let fraction = stamp.range(at: 3)
          +                let digits = fraction.location == NSNotFound ? "" : source.substring(with: fraction)
          +                let ms = Int((digits + "000").prefix(3)) ?? 0
          +                let start = max(0, (minutes * 60 + seconds) * 1000 + ms - adjustment)
          +                if byTime[start] == nil || byTime[start]?.isEmpty == true { byTime[start] = text }
          +            }
          +        }
          +        lines = byTime.keys.sorted().map { MusicLyricLine(startMS: $0, text: byTime[$0] ?? "") }
          +    }
          +
          +    func line(at ms: Int) -> MusicLyricLine? {
          +        var low = 0, high = lines.count
          +        while low < high {
          +            let mid = low + (high - low) / 2
          +            if lines[mid].startMS <= ms { low = mid + 1 } else { high = mid }
          +        }
          +        guard low > 0, !lines[low - 1].text.isEmpty else { return nil }
          +        return lines[low - 1]
          +    }
          +
          +    func token(at ms: Int) -> String {
          +        if let line = line(at: ms) { return "line-\(line.startMS)" }
          +        return "time-\(max(0, ms) / 15000 * 15000)"
          +    }
          +
          +    // An old rendered button may arrive after the next line starts. Preserve the line
          +    // the owner saw. The caller also checks the playback epoch, including repeat-one.
          +    func capture(token: String, now: Int, duration: Int) -> (Int, String)? {
          +        let parts = token.split(separator: "-", maxSplits: 1)
          +        guard parts.count == 2, let start = Int(parts[1]), start >= 0, start <= duration else { return nil }
          +        let position = self.token(at: now) == token ? min(now, duration) : start
          +        switch parts[0] {
          +        case "line":
          +            guard let line = line(at: start), line.startMS == start else { return nil }
          +            return (position, line.text)
          +        case "time" where start % 15000 == 0: return (position, "")
          +        default: return nil
          +        }
          +    }
          +}
