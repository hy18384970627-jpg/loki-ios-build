          +import Foundation
          +
          +enum IslandReplayTarget {
          +    static func local(_ items: [ChatItem], request: UUID, line: String) -> ChatItem? {
          +        let reply = items.lazy.filter { $0.role == "assistant" && $0.replyingTo == request }
          +        if line.isEmpty { return reply.first }
          +        guard let id = UUID(uuidString: line) else { return nil }
          +        return reply.first { $0.id == id }
          +    }
          +
          +    static func pinned(_ candidate: ChatItem, request: UUID, line: String, preview: String) -> ChatItem? {
          +        if agrees(preview, with: candidate.displayText) { return candidate }
          +        // A push preview can stop before the attribution in a grouped dialogue bubble.
          +        // Only accept a complete, exact opening sentence of this already matched reply.
          +        guard line.isEmpty, !preview.isEmpty, preview.count <= 240,
          +              normalized(candidate.displayText).hasPrefix(normalized(preview)),
          +              let last = preview.trimmingCharacters(in: CharacterSet(charactersIn: "”’\\\"'»")).last,
          +              ".!?。！？".contains(last) else { return nil }
          +        // Keep any performance cue that belongs to this sentence.
          +        var phrase = ""
          +        for char in candidate.voiceText {
          +            phrase.append(char)
          +            if char == preview.last, normalized(ChatItem(role: "assistant", text: phrase).displayText) == normalized(preview) {
          +                var segment = ChatItem(role: "assistant", text: preview, id: request, speechText: phrase)
          +                segment.replyingTo = request
          +                return segment
          +            }
          +        }
          +        return nil
          +    }
          +    private static func normalized(_ value: String) -> String {
          +        value.split(whereSeparator: { $0.isWhitespace }).joined(separator: " ")
          +    }
          +    static func agrees(_ preview: String, with text: String) -> Bool {
          +        guard !preview.isEmpty else { return false }
          +        return preview == String(text.prefix(240)) || preview == IslandText.limit(text, bytes: 640)
          +    }
          +}
