          +
          +@MainActor final class DeskIslandPush {
          +    static let shared = DeskIslandPush()
          +    private typealias DeskActivity = Activity<LokiMomentAttributes>
          +    private var observing = false
          +    private var token: Data?
          +    private var watching = Set<String>()
          +    private var registered: [String]?
          +    private var registering = false
          +    private var resync = false
          +
          +    func observe() {
          +        guard !observing else { return }
          +        observing = true
          +        token = DeskActivity.pushToStartToken
          +        Task {
          +            for await newToken in DeskActivity.pushToStartTokenUpdates {
          +                token = newToken
          +                await sync()
          +            }
          +        }
          +        Task {
          +            for item in DeskActivity.activities { observe(item) }
          +            for await item in DeskActivity.activityUpdates { observe(item) }
          +        }
          +    }
          +
          +    private func observe(_ item: DeskActivity) {
          +        guard item.attributes.kind == .desk, watching.insert(item.id).inserted else { return }
          +        Task {
          +            if item.content.state.phase == "arrived" {
          +                let app = AppState.islandShared
          +                if app.paired, ChatLiveActivity.shared.enabled {
          +                    // An APNs start can launch the app in the background without opening a scene.
          +                    // Retry a coalesced/temporarily unavailable private fetch within the wake window.
          +                    for _ in 0..<3 {
          +                        _ = await DeskIslandReader.shared.refresh(api: app.api)
          +                        if item.content.state.phase != "arrived" || item.activityState == .ended || item.activityState == .dismissed { break }
          +                        try? await Task.sleep(for: .seconds(1))
          +                    }
          +                } else { await item.end(nil, dismissalPolicy: .immediate) }
          +            }
          +            await sync()
          +            if item.activityState != .ended && item.activityState != .dismissed {
          +                for await state in item.activityStateUpdates {
          +                    if state == .ended || state == .dismissed { break }
          +                }
          +            }
          +            watching.remove(item.id)
          +            await sync()
          +        }
          +    }
          +
          +    func sync() async {
          +        observe()
          +        guard !registering else { resync = true; return }
          +        registering = true
          +        defer { registering = false }
          +        repeat {
          +            resync = false
          +            let app = AppState.islandShared
          +            guard app.paired, let device = UserDefaults.standard.string(forKey: "apnsToken"),
          +                  !device.isEmpty else { registered = nil; return }
          +            let settings = await UNUserNotificationCenter.current().notificationSettings()
          +            let authorized = [.authorized, .provisional, .ephemeral].contains(settings.authorizationStatus)
