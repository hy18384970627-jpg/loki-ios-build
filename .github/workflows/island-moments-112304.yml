          +    @Parameter(title: "Action") var action: String
          +    @Parameter(title: "Item") var key: String
          +    @Parameter(title: "Position") var token: String
          +    init() {}
          +    init(_ action: LokiIslandAction, _ key: String, _ token: String) {
          +        self.action = action.rawValue; self.key = key; self.token = token
          +    }
          +    @MainActor func perform() async throws -> some IntentResult {
          +        #if LOKI_ISLAND_APP
