          +
          +enum IslandText {
          +    static func limit(_ text: String, bytes: Int) -> String {
          +        var end = text.startIndex, count = 0
          +        while end < text.endIndex {
          +            let next = text.index(after: end)
          +            count += text[end..<next].utf8.count
          +            if count > bytes { break }
          +            end = next
          +        }
          +        return String(text[..<end])
          +    }
          +}
