          +import Foundation
          +
          +struct BusyPlanSnapshot: Decodable {
          +    struct Agreement: Decodable {
          +        let id: String
          +        let until: Int64
          +        let can_extend: Bool
          +    }
          +    let agreement: Agreement?
          +    let revision: Int64
          +    let status: String?
          +}
          +
          +@MainActor final class BusyIslandAgreement {
          +    static let shared = BusyIslandAgreement()
          +    private var scope: MobileAPI?
          +    private var revision: Int64 = -1
          +    private var visibleKey: String?
          +    private var expiry: Task<Void, Never>?
          +
          +    private var pairedAPI: MobileAPI {
          +        MobileAPI(base: UserDefaults.standard.string(forKey: "gatewayURL") ?? "", token: SecureToken.read())
          +    }
          +
          +    func refresh(api: MobileAPI) async {
          +        guard !api.base.isEmpty, !api.token.isEmpty else { return }
          +        do {
          +            let data = try await api.data("/v1/care/agreement", timeout: 8)
          +            try await apply(JSONDecoder().decode(BusyPlanSnapshot.self, from: data), api: api)
          +        } catch {
          +            // The last acknowledged deadline continues to expire locally while offline.
          +        }
          +    }
          +
          +    func extend(key: String, token: String) async throws {
          +        guard UUID(uuidString: key) != nil, let deadline = Int64(token), deadline > 0 else {
          +            throw LokiError.message("This break is no longer available.")
          +        }
          +        let api = pairedAPI
          +        let data = try await api.data("/v1/care/agreement/extend", [
          +            "agreement_id": key, "expected_deadline": deadline
          +        ], timeout: 8)
          +        let result = try JSONDecoder().decode(BusyPlanSnapshot.self, from: data)
          +        await apply(result, api: api)
          +        guard result.status == "extended" || result.status == "already_applied" else {
          +            throw LokiError.message("This break has already changed.")
          +        }
          +    }
          +
          +    func apply(_ snapshot: BusyPlanSnapshot, api: MobileAPI) async {
          +        let current = pairedAPI
          +        guard api.base == current.base, api.token == current.token, !api.token.isEmpty else { return }
          +        if scope?.base != api.base || scope?.token != api.token {
          +            expiry?.cancel()
          +            scope = api
          +            revision = -1
          +            visibleKey = nil
          +        }
          +        guard snapshot.revision >= revision else { return }
          +        let firstSnapshot = revision < 0
          +        revision = snapshot.revision
          +        guard let agreement = snapshot.agreement,
          +              Date(timeIntervalSince1970: TimeInterval(agreement.until)) > Date() else {
          +            expiry?.cancel()
          +            let priorKey = visibleKey
          +            visibleKey = nil
          +            if firstSnapshot || priorKey != nil { await LokiIsland.shared.hide(.busy, key: priorKey) }
          +            return
          +        }
          +        let end = Date(timeIntervalSince1970: TimeInterval(agreement.until))
          +        visibleKey = agreement.id
          +        expiry?.cancel()
          +        expiry = Task { [weak self] in
          +            do { try await Task.sleep(for: .seconds(max(0, end.timeIntervalSinceNow))) } catch { return }
          +            guard let self, revision == snapshot.revision, visibleKey == agreement.id else { return }
          +            visibleKey = nil
          +            await LokiIsland.shared.hide(.busy, key: agreement.id)
          +        }
          +        await LokiIsland.shared.show(kind: .busy, key: agreement.id, phase: "busy", title: "Time to yourself",
          +            detail: "Until " + end.formatted(date: .omitted, time: .shortened),
          +            action: agreement.can_extend ? .extendBusy : nil, token: agreement.can_extend ? String(agreement.until) : "",
          +            until: end, staleAt: end)
          +    }
          +}
