          repository: hy18384970627-jpg/loki-ios-build
          ref: bdf05059603c369e0f2cceb56890ed1fa2f7d437
          path: prior-recipe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
