          path: launch-base-recipe
          persist-credentials: false
      - name: Reconstruct the verified 112301 client
        shell: bash
        run: |
          echo 'd7d9ffe68abef819c9eb12de354252a080281ccee8b6984bb02068ca3c660e0a  launch-base-recipe/.github/workflows/health-wake-112301.yml' | shasum -a 256 -c -
          ruby <<'PREVIOUS'
          require 'yaml'
          require 'json'
          steps = YAML.load_file('launch-base-recipe/.github/workflows/health-wake-112301.yml').fetch('jobs').fetch('app').fetch('steps')
          JSON.parse('["Reconstruct verified public build 112104", "Stage reviewed Swift changes 1", "Stage reviewed Swift changes 2", "Stage reviewed Swift changes 3", "Stage reviewed Swift changes 4", "Stage reviewed Swift changes 5", "Stage reviewed Swift changes 6", "Stage reviewed Swift changes 7", "Stage reviewed Swift changes 8", "Stage reviewed Swift changes 9", "Apply reviewed wake and health changes"]').each do |name|
            matches = steps.select { |s| s['name'] == name }
            abort('Missing baseline step') unless matches.size == 1
            step=matches.first
            dir=step.fetch('working-directory','.')
            abort('Unexpected baseline directory') unless ['.','app-source'].include?(dir)
            system('/bin/bash','-e','-o','pipefail','-c',step.fetch('run'),chdir:dir) or abort(name)
          end
          PREVIOUS
